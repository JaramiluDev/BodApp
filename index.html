<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Boda | M & H</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
  <style>
    body { background-color: #000; margin: 0; padding: 0; font-family: sans-serif; }
    .card { border-radius: 20px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .font-serif { font-family: 'Times New Roman', Times, serif; }
  </style>
</head>
<body>

  <!-- PANTALLA 1: INICIO -->
  <div id="pantalla-inicio" class="relative flex min-h-screen w-full flex-col overflow-hidden bg-black text-white" style="background-image: url('img/fondo.jpg'); background-size: cover; background-position: center;">
    <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-black/20 to-black/90"></div>
    <div class="relative z-10 flex flex-1 flex-col items-center justify-center px-6 text-center mt-20">
      <p class="text-sm font-medium uppercase tracking-[0.5em] text-white/90">Nuestra boda</p>
      <h1 class="mt-6 font-serif text-7xl font-semibold tracking-wide text-white drop-shadow-lg">M & H</h1>
      <p class="mt-4 text-base font-medium uppercase tracking-[0.35em] text-white/90">5 de Septiembre 2026</p>
      <span class="mt-5 block h-px w-16 bg-white/70"></span>
    </div>
    <div class="relative z-10 flex flex-col gap-3 px-6 pb-12 w-full max-w-md mx-auto">
      <button id="btn-mostrar-subida" class="flex w-full items-center justify-center gap-3 rounded-full bg-white/95 px-6 py-4 text-base font-semibold text-black shadow-lg hover:bg-white">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Subir recuerdos
      </button>
      <button id="btn-mostrar-recuerdos" class="flex w-full items-center justify-center gap-3 rounded-full border border-white/25 bg-black/40 px-6 py-4 text-base font-semibold text-white backdrop-blur-md hover:bg-black/55">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        Ver recuerdos
      </button>
    </div>
  </div>

  <!-- PANTALLA 2: SUBIDA -->
  <div id="pantalla-subida" class="d-none min-h-screen d-flex flex-column align-items-center justify-content-center bg-light p-4">
    <div class="container text-center" style="max-width: 500px;">
      <button id="btn-volver-1" class="btn btn-outline-dark mb-4 fw-bold rounded-pill px-4">&larr; Volver al inicio</button>
      <h2 class="mb-4 fw-bold" style="color: #2c3e50;">Comparte tus Recuerdos</h2>
      <div class="card p-4">
        <input type="file" id="fileInput" class="form-control mb-3" multiple accept="image/*,video/*">
        <button id="uploadBtn" class="btn btn-dark w-100 py-3 fw-bold rounded-pill">Subir Recuerdos</button>
        <div id="loading" class="mt-3 d-none">
          <div class="spinner-border text-dark" role="status"></div>
          <p class="mt-2 text-muted fw-bold">Optimizando y subiendo...</p>
        </div>
        <p id="status" class="mt-3 text-success fw-bold d-none">¡Recuerdos guardados! 🎉</p>
      </div>
    </div>
  </div>

  <!-- PANTALLA 3: GALERÍA (Tu nuevo diseño) -->
  <div id="pantalla-recuerdos" class="d-none relative flex min-h-screen w-full flex-col overflow-hidden bg-[#1a1a1a] text-white">
    <header class="relative z-10 flex items-center gap-3 px-5 pt-6">
      <button id="btn-volver-2" class="flex size-10 items-center justify-center rounded-full bg-white/15 text-white backdrop-blur-sm hover:bg-white/25">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div>
        <p class="text-xs uppercase tracking-[0.35em] text-white/70">Nuestra boda</p>
        <h1 class="font-serif text-2xl font-semibold leading-none">Recuerdos M & H</h1>
      </div>
    </header>

    <div class="relative z-10 flex flex-1 flex-col items-center justify-center px-6 py-8">
      <div class="relative w-full max-w-[320px] aspect-[3/4] bg-[#f4ebd0] rounded-[1rem] shadow-2xl p-3 flex items-center justify-center overflow-hidden">
        <p id="texto-carga-galeria" class="text-black/60 font-semibold text-center px-4">Cargando fotos del servidor...</p>
          <img id="imagen-galeria" src="" class="d-none w-full h-full object-cover rounded-lg shadow-sm" alt="Recuerdo">
<video id="video-galeria" src="" class="d-none w-full h-full object-cover rounded-lg shadow-sm" controls autoplay muted loop playsinline></video>
      </div>
      
      <div class="flex items-center gap-6 mt-8">
        <button id="btn-prev" class="flex size-12 items-center justify-center rounded-full bg-white/10 hover:bg-white/20">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="flex gap-2" id="indicador-puntos">
          <span class="w-6 h-1.5 bg-white rounded-full"></span>
          <span class="w-1.5 h-1.5 bg-white/30 rounded-full"></span>
        </div>
        <button id="btn-next" class="flex size-12 items-center justify-center rounded-full bg-white/10 hover:bg-white/20">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <p class="mt-6 text-center text-xs text-white/50">Toca la derecha para avanzar y la izquierda para regresar</p>
    </div>
  </div>

  <script>
    const URL_BASE = 'https://chirpy-stuffy-half.ngrok-free.dev';
    
    // 1. Navegación entre pantallas
    const vistas = {
      inicio: document.getElementById('pantalla-inicio'),
      subida: document.getElementById('pantalla-subida'),
      recuerdos: document.getElementById('pantalla-recuerdos')
    };

    function mostrarPantalla(id, bgColor) {
      Object.values(vistas).forEach(v => v.classList.add('d-none'));
      vistas[id].classList.remove('d-none');
      document.body.style.backgroundColor = bgColor;
    }

    document.getElementById('btn-mostrar-subida').onclick = () => mostrarPantalla('subida', '#f4f6f9');
    document.getElementById('btn-volver-1').onclick = () => mostrarPantalla('inicio', '#000');
    document.getElementById('btn-volver-2').onclick = () => mostrarPantalla('inicio', '#000');

    // 2. Lógica del Carrusel
    let mediaArr = [];
    let indiceActual = 0;
    const imgGaleria = document.getElementById('imagen-galeria');
    const vidGaleria = document.getElementById('video-galeria');
    const textoCarga = document.getElementById('texto-carga-galeria');

    function renderizarMedia(index) {
      const archivo = mediaArr[index];
      if (archivo.tipo === 'video') {
        imgGaleria.classList.add('d-none');
        vidGaleria.classList.remove('d-none');
        vidGaleria.src = archivo.url;
      } else {
        vidGaleria.classList.add('d-none');
        vidGaleria.pause();
        imgGaleria.classList.remove('d-none');
        imgGaleria.src = archivo.url;
      }
    }

    document.getElementById('btn-mostrar-recuerdos').onclick = async () => {
      mostrarPantalla('recuerdos', '#1a1a1a');
      try {
        const res = await fetch(`${URL_BASE}/api/images`);
        mediaArr = await res.json();
        
        if (mediaArr.length > 0) {
          textoCarga.classList.add('d-none');
          indiceActual = 0;
          renderizarMedia(indiceActual);
        } else {
          textoCarga.textContent = "Aún no hay recuerdos subidos.";
        }
      } catch (e) {
        textoCarga.textContent = "Error al cargar los archivos.";
      }
    };

    document.getElementById('btn-next').onclick = () => {
      if (mediaArr.length === 0) return;
      indiceActual = (indiceActual + 1) % mediaArr.length;
      renderizarMedia(indiceActual);
    };

    document.getElementById('btn-prev').onclick = () => {
      if (mediaArr.length === 0) return;
      indiceActual = (indiceActual - 1 + mediaArr.length) % mediaArr.length;
      renderizarMedia(indiceActual);
    };

    // 3. Subida de archivos
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const loading = document.getElementById('loading');
    const statusText = document.getElementById('status');

    uploadBtn.addEventListener('click', async () => {
      const files = fileInput.files;
      if (files.length === 0) return alert('Selecciona al menos una foto bro.');
      if (files.length > 10) return alert('Máximo 10 fotos a la vez.');
    
      uploadBtn.disabled = true;
      loading.classList.remove('d-none');
      statusText.classList.add('d-none');
    
      let errores = 0;
      for (let file of files) {
        try {
          if (file.type.startsWith('image/')) {
            file = await imageCompression(file, { maxSizeMB: 2, maxWidthOrHeight: 1920, useWebWorker: true });
          }
          const formData = new FormData();
          formData.append('fotos', file, file.name);
          const res = await fetch(`${URL_BASE}/api/upload`, { method: 'POST', body: formData });
          if (!res.ok) errores++;
        } catch (error) { errores++; }
      }
      uploadBtn.disabled = false;
      loading.classList.add('d-none');
      if (errores > 0) alert(`Hubo error en ${errores} archivo(s).`);
      else {
        statusText.classList.remove('d-none');
        fileInput.value = ''; 
        setTimeout(() => statusText.classList.add('d-none'), 4000);
      }
    });
  </script>

</body>
</html>
