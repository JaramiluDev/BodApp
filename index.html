<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Boda | M & H</title>
  
  <!-- Tailwind CSS para el diseño elegante -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Bootstrap para el formulario -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Librería de compresión -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
  
  <style>
    /* Estilos base para evitar choques entre Tailwind y Bootstrap */
    body { background-color: #000; margin: 0; padding: 0; font-family: sans-serif; }
    .card { border-radius: 20px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .font-serif { font-family: 'Times New Roman', Times, serif; }
  </style>
</head>
<body>

  <!-- PANTALLA 1: INICIO ELEGANTE (Tu diseño) -->
  <div id="pantalla-inicio" class="relative flex min-h-screen w-full flex-col overflow-hidden bg-black text-white" style="background-image: url('img/fondo.jpg'); background-size: cover; background-position: center;">
    
    <!-- Degradado oscuro -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-black/20 to-black/90"></div>

    <!-- Título central -->
    <div class="relative z-10 flex flex-1 flex-col items-center justify-center px-6 text-center mt-20">
      <p class="text-sm font-medium uppercase tracking-[0.5em] text-white/90">Nuestra boda</p>
      <h1 class="mt-6 font-serif text-7xl font-semibold tracking-wide text-white drop-shadow-lg">M & H</h1>
      <p class="mt-4 text-base font-medium uppercase tracking-[0.35em] text-white/90">5 de Septiembre 2026</p>
      <span class="mt-5 block h-px w-16 bg-white/70"></span>
    </div>

    <!-- Botones inferiores -->
    <div class="relative z-10 flex flex-col gap-3 px-6 pb-12 w-full max-w-md mx-auto">
      <button id="btn-mostrar-subida" type="button" class="flex w-full items-center justify-center gap-3 rounded-full bg-white/95 px-6 py-4 text-base font-semibold text-black shadow-lg transition-colors hover:bg-white">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Subir recuerdos
      </button>
      <button type="button" class="flex w-full items-center justify-center gap-3 rounded-full border border-white/25 bg-black/40 px-6 py-4 text-base font-semibold text-white backdrop-blur-md transition-colors hover:bg-black/55">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        Ver recuerdos
      </button>
    </div>
  </div>

  <!-- PANTALLA 2: FORMULARIO DE SUBIDA (Oculto al inicio) -->
  <div id="pantalla-subida" class="d-none min-h-screen d-flex flex-column align-items-center justify-content-center bg-light p-4">
    <div class="container text-center" style="max-width: 500px;">
      
      <!-- Botón para regresar -->
      <button id="btn-volver" class="btn btn-outline-dark mb-4 fw-bold rounded-pill px-4">
        &larr; Volver al inicio
      </button>

      <h2 class="mb-4 fw-bold" style="color: #2c3e50;">Comparte tus Recuerdos</h2>
      <div class="card p-4">
        <p class="text-muted mb-4">Sube las fotos y videos que tomaste. (Máximo 10 a la vez)</p>
        
        <input type="file" id="fileInput" class="form-control mb-3" multiple accept="image/*,video/*">
        <button id="uploadBtn" class="btn btn-dark w-100 py-3 fw-bold rounded-pill">Subir Recuerdos</button>
        
        <div id="loading" class="mt-3 d-none">
          <div class="spinner-border text-dark" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
          <p class="mt-2 text-muted fw-bold">Optimizando y subiendo... no cierres la ventana.</p>
        </div>

        <p id="status" class="mt-3 text-success fw-bold d-none">¡Recuerdos guardados! 🎉</p>
      </div>
    </div>
  </div>

  <script>
    // Lógica de cambio de pantallas
    const pantallaInicio = document.getElementById('pantalla-inicio');
    const pantallaSubida = document.getElementById('pantalla-subida');
    
    document.getElementById('btn-mostrar-subida').addEventListener('click', () => {
      pantallaInicio.classList.add('d-none');
      pantallaSubida.classList.remove('d-none');
      document.body.style.backgroundColor = "#f4f6f9"; // Fondo claro para el form
    });

    document.getElementById('btn-volver').addEventListener('click', () => {
      pantallaSubida.classList.add('d-none');
      pantallaInicio.classList.remove('d-none');
      document.body.style.backgroundColor = "#000"; // Fondo oscuro para el inicio
    });

    // Lógica de subida de archivos (Tu código intacto)
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const loading = document.getElementById('loading');
    const statusText = document.getElementById('status');
    
    const BACKEND_URL = 'https://chirpy-stuffy-half.ngrok-free.dev/api/upload';
    
    uploadBtn.addEventListener('click', async () => {
      const files = fileInput.files;
      if (files.length === 0) return alert('Selecciona al menos una foto bro.');
      if (files.length > 10) return alert('Máximo 10 fotos a la vez para no trabar el internet.');
    
      uploadBtn.disabled = true;
      loading.classList.remove('d-none');
      statusText.classList.add('d-none');
    
      let errores = 0;
      const compressionOptions = { maxSizeMB: 2, maxWidthOrHeight: 1920, useWebWorker: true };

      for (let i = 0; i < files.length; i++) {
        let fileToUpload = files[i];

        try {
          if (fileToUpload.type.startsWith('image/')) {
            fileToUpload = await imageCompression(fileToUpload, compressionOptions);
          }

          const formData = new FormData();
          formData.append('fotos', fileToUpload, fileToUpload.name);
      
          const response = await fetch(BACKEND_URL, {
            method: 'POST',
            body: formData
          });
          
          if (!response.ok) errores++;
          
        } catch (error) {
          errores++;
        }
      }
  
      uploadBtn.disabled = false;
      loading.classList.add('d-none');
  
      if (errores > 0) {
        alert(`Se subieron algunas, pero hubo error en ${errores} archivo(s).`);
      } else {
        statusText.classList.remove('d-none');
        fileInput.value = ''; 
        setTimeout(() => statusText.classList.add('d-none'), 4000);
      }
    });
  </script>
</body>
</html>
